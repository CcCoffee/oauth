server:
  port: 9000

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

spring:
  application:
    name: api-auth-server
  datasource:
    url: jdbc:postgresql://localhost:5432/oauth
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema/oauth2-schema.sql
#      data-locations: classpath:schema/init.sql
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9000

# Micrometer Tracing 配置
management:
  tracing:
    sampling:
      probability: 1.0  # 开发环境100%采样，生产环境建议设置较低值如0.1
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus

# 密钥库配置
app:
  jwt:
    keystore:
      path: mykeystore.jks
      password: mykeystorepass
      key-alias: myalias
      key-password: mykeypass
  admin:
    username: admin
    password: admin123
    role: ADMIN

oauth2:
  migration:
    enabled: true
    legacy-server:
      url: http://localhost:9001
      username: admin
      password: admin123